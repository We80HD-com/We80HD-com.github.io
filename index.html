<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We80HD — ADHD Brain Tips & Focus Strategies</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0D1B2A;
      color: #E8F4FD;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -1px;
      color: #00D4FF;
      margin-bottom: 0.5rem;
    }
    .tagline {
      font-size: 1.15rem;
      color: #A0C4D8;
      margin-bottom: 2.5rem;
      max-width: 480px;
      line-height: 1.6;
    }
    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .links a {
      color: #00D4FF;
      text-decoration: none;
      font-size: 0.9rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .links a:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">We80HD</div>
  <p class="tagline">ADHD brain tips and focus strategies — short-form content delivered daily on TikTok, Instagram, and YouTube.</p>
  <nav class="links">
    <a href="/terms/">Terms of Service</a>
    <a href="/privacy/">Privacy Policy</a>
    <a href="https://www.tiktok.com/@we80hd" target="_blank" rel="noopener">TikTok</a>
  </nav>
</body>
</html>
